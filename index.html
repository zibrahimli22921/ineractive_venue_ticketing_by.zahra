<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmonia Theatre - Interactive Ticketing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1>Harmonia Theatre Ticketing</h1>
        <p>Select your seats, inspect details, and secure your tickets.</p>
    </header>

    <main class="app-container">
        <!-- Venue Map Section with Navigation Controls -->
        <section class="map-section">
            <div class="navigation-controls">
                <div class="nav-group">
                    <button id="zoom-in" title="Zoom In">+</button>
                    <button id="zoom-out" title="Zoom Out">-</button>
                </div>
                <div class="nav-group">
                    <button id="move-up" title="Move Up">⬆</button>
                    <div class="horizontal-nav">
                        <button id="move-left" title="Move Left">⬅</button>
                        <button id="reset-view" title="Reset View">⊙</button>
                        <button id="move-right" title="Move Right">➡</button>
                    </div>
                    <button id="move-down" title="Move Down">⬇</button>
                </div>
            </div>

            <!-- Map Viewport -->
            <div id="map-viewport">
                <div id="venue-map">
                    <div class="stage">STAGE</div>
                    <div id="sections-container"></div>
                </div>
            </div>
            
            <div class="legend">
                <span class="legend-item"><span class="seat-sample available"></span> Available</span>
                <span class="legend-item"><span class="seat-sample inspected"></span> Inspected</span>
                <span class="legend-item"><span class="seat-sample in-cart"></span> In Cart</span>
                <span class="legend-item"><span class="seat-sample unavailable"></span> Unavailable</span>
            </div>
        </section>

        <!-- Sidebar: Inspection & Cart -->
        <aside class="sidebar">
            <!-- Seat Inspection Panel -->
            <div class="panel inspection-panel">
                <h2>Seat Inspection</h2>
                <div id="inspection-details">
                    <p class="placeholder-text">Click any seat on the map to inspect its details and price.</p>
                </div>
                <button id="add-to-cart-btn" class="primary-btn" disabled>Add to Cart</button>
            </div>

            <!-- Cart Panel -->
            <div class="panel cart-panel">
                <h2>Your Cart</h2>
                <ul id="cart-items-list">
                    <li class="empty-cart">Your cart is empty.</li>
                </ul>
                <div class="cart-summary">
                    <div class="total-row">
                        <span>Total:</span>
                        <span id="cart-total">$0.00</span>
                    </div>
                    <button id="checkout-btn" class="primary-btn checkout-btn" disabled>Proceed to Checkout</button>
                </div>
            </div>
        </aside>
    </main>

    <script src="script.js"></script>
</body>
</html>
